  language: "zh-Hans"
  minimum_age: "18（ASSUMPTION，因 Web3/行情题材采用更保守原型边界）"
  lifecycle: "mixed"
  accessibility:
    - "支持键盘和触控"
    - "可见焦点"
    - "减少动态效果偏好"
    - "颜色不作为唯一状态提示"

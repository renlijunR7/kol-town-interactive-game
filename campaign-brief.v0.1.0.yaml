gameplay:
  mechanic: "collection + tap_challenge"
  fantasy: "作为 KOL 小镇市长，通过完成任务、访问建筑和升级地标，让主题街区逐步繁荣"
  core_loop:
    - "接受市长引导"
    - "在等距小镇地图选择建筑"
    - "完成答题、预测、直播签到或社区任务"
    - "获得仅限本地的虚拟砖块与繁荣度"
    - "升级建筑并解锁装扮"
    - "完成当日成长目标后查看结算与重玩"
  target_duration_seconds: 180
  rounds: 5
  difficulty: "1-5，默认 2；原型内仅影响答题与计时"
  success: "完成 3 个有效任务并将小镇繁荣度提升到 100"
  failure: "计时任务失败时可立即重试，不造成真实资产损失"
screens:
  - "新手引导 · 市长对话式"
  - "小镇主界面 · 沉浸式地图"
  - "建筑抽屉弹层"
  - "任务与积分中心"
  - "榜单"
  - "形象定制"
  - "HTX 旗舰大楼"
  - "首次升级 CTA 弹窗"
  - "钱包 / 权益卡包（模拟）"
  - "Vera 小镇换皮演示"

brand:
  legal_entity: "【待人工录入】"
  approved_assets: "Claude Design 项目中的视觉稿仅用于本地原型参照；发布授权待确认"
  approved_claims: []
  prohibited_claims:
    - "收益保证"
    - "投资回报承诺"
